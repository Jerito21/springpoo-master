<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f11;
            --surface: #18181c;
            --border: #2a2a30;
            --accent: #c8f135;
            --accent-dim: #9bbf1e;
            --text: #e8e8ec;
            --muted: #6b6b78;
            --danger: #ff4d4d;
            --radius: 12px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.4rem;
            letter-spacing: -0.5px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 28px;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 500;
        }

        input[type="text"] {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            padding: 10px 14px;
            transition: border-color 0.2s;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        .btn {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 10px 22px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--accent);
            color: #0f0f11;
            margin-top: 8px;
        }

        .btn-primary:hover { background: var(--accent-dim); }

        .btn-danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 14px;
            font-size: 0.78rem;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead tr { border-bottom: 1px solid var(--border); }

        th {
            text-align: left;
            padding: 10px 14px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: rgba(200, 241, 53, 0.03); }

        .badge-id {
            background: var(--border);
            border-radius: 4px;
            color: var(--muted);
            font-size: 0.75rem;
            padding: 2px 8px;
        }

        .empty-state {
            color: var(--muted);
            font-size: 0.85rem;
            padding: 24px 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>Gestión de Usuarios</h1>
    <p class="subtitle">Sistema de registro · SENA Springpoo</p>

    <!-- REGISTRO -->
    <div class="card">
        <p class="card-title">Registrar usuario</p>
        <form action="/guardar" method="post">
            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" name="nombre" placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-group">
                    <label>Tipo Documento</label>
                    <input type="text" name="tipoDocumento" placeholder="Ej: CC, TI, CE">
                </div>

                <div class="form-group">
                    <label>Documento</label>
                    <input type="text" name="documento" placeholder="Número de documento">
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" name="telefono" placeholder="Ej: 3001234567">
                </div>

            </div>
            <button type="submit" class="btn btn-primary">Guardar usuario</button>
        </form>
    </div>

    <!-- LISTA Y ELIMINACIÓN -->
    <div class="card">
        <p class="card-title">Usuarios registrados</p>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Tipo Doc.</th>
                    <th>Documento</th>
                    <th>Teléfono</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>

                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="empty-state">No hay usuarios registrados aún.</td>
                </tr>

                <tr th:each="u : ${usuarios}">
                    <td><span class="badge-id" th:text="${u.id}"></span></td>
                    <td th:text="${u.nombre}"></td>
                    <td th:text="${u.tipoDocumento}"></td>
                    <td th:text="${u.documento}"></td>
                    <td th:text="${u.telefono}"></td>
                    <td>
                        <form th:action="@{/eliminar/{id}(id=${u.id})}" method="post"
                              onsubmit="return confirm('¿Desea eliminar este usuario?')">
                            <input type="hidden" name="_method" value="DELETE"/>
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
